kind = "mobile"
previewPath = "/"
title = "Drinks Store"
version = "1.0.0"
id = "artifacts/drinks-store"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22397

[services.development]
run = "pnpm --filter @workspace/drinks-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/drinks-store", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/drinks-store", "run", "serve" ]

[services.env]
PORT = "22397"
BASE_PATH = "/"
